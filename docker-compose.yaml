services:
  postgres:
    image: postgres:latest
    container_name: loto-postgres
    environment:
      POSTGRES_DB: loto
      POSTGRES_USER: loto
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: loto-redis
    ports:
      - "6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loto-app
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: